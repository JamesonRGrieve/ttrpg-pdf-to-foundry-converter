# SPDX-License-Identifier: AGPL-3.0-or-later
# Bundled example profile (spec §12). Single-column equipment catalogue: bold
# item headers over a normal-weight body with Cost/Weight/Rarity lines. Targets
# the synthetic free-content fixture `item-catalog`. Ships zero commercial data.
schema_version: 1
profile_id: example-item-catalog
name: Single-column equipment catalogue
version: 1.0.0
license: CC0-1.0

fingerprint:
    page_size: { w: 612, h: 792, tol: 2 }
    fonts: ["libertinusserif-bold", "libertinusserif-regular"]
    size_buckets: [8.0, 9.0, 11.0]

exclude:
    - { region: { y_min: 0, y_max: 322 } } # summary table
    - { region: { y_min: 748, y_max: 792 } } # running head

selectors:
    item_name: { weight: bold, size: 11.0 }
    body: { weight: normal, size: 9.0 }

blocks:
    - id: item
      starts_at: item_name
      ends_at: { next: item_name }
      fields:
          - { name: name, from: item_name, transform: [trim], required: true }
          - { name: description, from: body, match: "(?s)^(.*?)Cost", capture: 1, transform: [collapse_ws] }
          - { name: cost, from: body, match: 'Cost (\d+)', capture: 1, transform: [to_int] }
          - { name: weight, from: body, match: 'Weight (\d+)', capture: 1, transform: [to_int] }
          - { name: rarity, from: body, match: 'Rarity (\w+)', capture: 1, transform: [trim] }

emit:
    - block: item
      document_type: Item
      group: examples
      pack: fixture-gear
      map:
          name: $name
          type: gear
          system.description: $description
          system.cost.value: $cost
          system.weight.value: $weight
          system.rarity: $rarity

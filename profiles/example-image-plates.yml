# SPDX-License-Identifier: AGPL-3.0-or-later
# Bundled example profile (spec §12). Emits one JournalEntry per illustrated
# "plate" heading. Its companion fixture `images` exercises Tier A embedded
# image recovery (JPEG passthrough, Flate PNG re-encode, CMYK, content-addressed
# dedup of a reused image). Fabricated content; ships zero third-party data.
schema_version: 1
profile_id: example-image-plates
name: Illustrated plate index
version: 1.0.0
license: CC0-1.0

fingerprint:
    page_size: { w: 300, h: 400, tol: 2 }
    columns: 1
    fonts: ["libertinusserif-bold"]
    size_buckets: [12.0]

selectors:
    plate_title: { weight: bold, size: 12.0 }

blocks:
    - id: plate
      starts_at: plate_title
      ends_at: { next: plate_title }
      fields:
          - { name: name, from: plate_title, transform: [trim], required: true }

emit:
    - block: plate
      document_type: JournalEntry
      group: examples
      pack: fixture-plates
      map:
          name: $name
